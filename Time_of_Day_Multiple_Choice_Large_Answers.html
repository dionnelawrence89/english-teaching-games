let order=[],position=0,answered=false,wrongChoice=null;
const $=id=>document.getElementById(id);
function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speakAnswer(){if(!('speechSynthesis' in window))return;stopVoice();let u=new SpeechSynthesisUtterance(images[order[position]].answer);u.lang='en-GB';u.rate=0.6;u.pitch=1;u.volume=1;let voices=window.speechSynthesis.getVoices(),english=voices.filter(v=>/^en[-_]/i.test(v.lang));let preferred=english.find(v=>/Samantha|Daniel|Serena|Google UK English Female|Google US English|Microsoft.*(Natural|Online)/i.test(v.name))||english.find(v=>v.localService&&/^en-GB/i.test(v.lang))||english.find(v=>/^en-GB/i.test(v.lang))||english[0];if(preferred)u.voice=preferred;window.speechSynthesis.speak(u)}

function choose(word){if(answered)return;let correct=images[order[position]].answer;if(word===correct){answered=true;wrongChoice=null;render();speakAnswer()}else{wrongChoice=word;render()}}
